syntax = "proto3";

package v2k;

import "google/protobuf/any.proto"

message Log {
  enum Level {
    DEBUG = 0;
    INFO = 1;
    WARN = 2;
    ERROR = 3;
    FATAL = 4;
  }

  int64 time = 1;
  Level level = 2;
  string message = 3;
  map<string, string> tags = 4;

  google.protobuf.Any details = 10;
}
