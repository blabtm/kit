version: "3"

vars:
  DOCKER_REGISTRY: ghcr.io/blabtm
  SCHEMA_DIR: "{{.ROOT_DIR}}/schema"
  CONFIG_DIR: "{{.ROOT_DIR}}/config"
  TOOLS_DIR: "{{.ROOT_DIR}}/tools"
  BLOB_DIR: "{{.ROOT_DIR}}/blob"

dotenv:
  - platform/env/secret.env
  - platform/env/build.env

includes:
  wiki:
    taskfile: ./wiki/Taskfile.yaml
    dir: ./wiki
  platform:
    taskfile: ./platform/Taskfile.yaml
    dir: ./platform
  native:
    taskfile: ./native/Taskfile.yaml
    dir: ./native
  jvm:
    taskfile: ./jvm/Taskfile.yaml
    dir: ./jvm
  py:
    taskfile: ./py/Taskfile.yaml
    dir: ./py

tasks:
  rpk:profile:create:
    status:
      - test -n "$(rpk profile list | grep v2k)"
    cmds:
      - rpk profile create v2k
    internal: true

  rpk:profile:update:
    deps: [rpk:profile:create]
    cmds:
      - rpk profile set brokers=$RP_HOST:$RP_LAN_PORT
      - rpk profile set schema_registry.addresses=$RP_HOST:$RP_SR_PORT

  sync:
    cmds:
      - "{{.TOOLS_DIR}}/sync/sync.sh"

  schema:install:
    cmds:
      - "{{.TOOLS_DIR}}/sync/schema-install.sh"
