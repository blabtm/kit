listeners:
  - type: "tcp"
    id: "tcp1"
    address: ":1883"
  - type: "ws"
    id: "ws1"
    address: ":1882"
  - type: "sysinfo"
    id: "stats"
    address: ":1880"
  - type: "tcp"
    id: "vcas"
    address: ":20041"
hooks:
  auth:
    allow_all: true
options:
  vcas: true
  db_addr: postgresql://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/logger
logging:
  level: INFO
