networks:
  v2k:
    external: true

volumes:
  grafana:

services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: $GRAFANA_PORT
        mode: ingress
    volumes:
      - grafana:/var/lib/grafana
      - $REPO_PATH/.obs.prov:/etc/grafana/provisioning:ro
    networks:
      - v2k
