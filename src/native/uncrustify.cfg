# Language & Basics
lang = C
newlines = LF
input_tab_size = 4
output_tab_size = 4

# Indentation
indent_columns = 4
indent_with_tabs = 0            # Strict spaces only
indent_align_string = true      # Align broken strings
indent_switch_case = 4          # Indent 'case' from 'switch'
indent_col1_comment = true      # Indent comments in column 1

# Spacing around Operators & Keywords
sp_arith = force                # Space around +, -, *, /
sp_assign = force               # Space around =
sp_bool = force                 # Space around &&, ||
sp_compare = force              # Space around ==, !=, <, >
sp_inside_paren = remove        # No space: (x) instead of ( x )
sp_paren_paren = remove         # No space: ((x)) instead of (( x ))
sp_before_ptr_star = force      # char *p;  (Pointer aligned with name)
sp_after_ptr_star = remove      # char *p;
sp_between_ptr_star = remove    # char **p;

# Spacing for Control Statements
sp_before_sparen = force        # Space before loop parens: if (x), while (x)
sp_inside_sparen = remove       # No space inside control parens
sp_after_sparen = force         # Space after control closing paren

# Code Alignment (For scannability)
align_keep_tabs = false
align_with_tabs = false
align_var_def_span = 1          # Align variable definitions if close
align_var_def_inline = true
align_assign_span = 1           # Light alignment for contiguous assignments
align_struct_init_span = 3      # Align struct initializers cleanly
align_func_params = true
align_nl_cont = true
align_nl_cont_span = 2

# Code Modifiers (Defensive Coding)
mod_full_brace_if = force       # Enforce braces on all 'if' statements
mod_full_brace_for = force      # Enforce braces on all 'for' loops
mod_full_brace_while = force    # Enforce braces on all 'while' loops
mod_full_brace_do = force       # Enforce braces on all 'do' loops
mod_remove_extra_semicolon = true

# Brace Placement (Allman Style / Broken Braces)
# NASA / JPL styles heavily favor braces on their own line for clarity.
nl_if_brace = force
nl_else_brace = force
nl_elseif_brace = force
nl_for_brace = force
nl_while_brace = force
nl_do_brace = force
nl_switch_brace = force
nl_fdef_brace = force           # Functions get braces on new line
nl_brace_else = force
nl_brace_while = force

# Newline Formatting
nl_max = 2                      # Maximum consecutive blank lines
nl_after_func_body = 2          # 2 blank lines after a function definition
nl_assign_leave_one_liners = false
