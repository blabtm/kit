name: dev
on:
  workflow_dispatch:
  push:
    branches:
      - trunk
    paths:
      - .devcontainer/**

jobs:
  pre-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io/fami-2026
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-Build Image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/blabtm/v2k.dev
          cacheFrom: ghcr.io/blabtm/v2k.dev
          push: always
