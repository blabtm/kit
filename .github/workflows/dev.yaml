name: Pre-Build Dev Container Image
on:
  push:
    branches:
      - trunk
    paths:
      - kit/.devcontainer/**

jobs:
  pre-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/blabtm
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Format Tag
        id: tag
        run: |
          PLATFORM=$(echo "${{ matrix.platform }}" | sed 's|/|-|g')
          echo "suffix=${PLATFORM}" >> $GITHUB_OUTPUT

      - name: Pre-Build Image
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/blabtm/v2k.dev
          imageTag: latest-${{ steps.tag.outputs.suffix }}
          cacheFrom: ghcr.io/blabtm/v2k.dev:latest-${{ steps.tag.outputs.suffix }}
          subFolder: kit
          platform: ${{ matrix.platform }}
          push: always

  merge:
    needs: pre-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/blabtm
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        uses: devcontainers/ci/merge@v0.3
        with:
          imageName: ghcr.io/blabtm/v2k.dev
          platforms: linux/amd64,linux/arm64
