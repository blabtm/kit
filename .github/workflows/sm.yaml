name: Release Service Manager
on:
  push:
    tags:
      - "platform/sm/v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Build
        run: task platform:sm:release
        env:
          TAG: ${{ github.ref_name }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          working_directory: platform/sm
          files: |
            sm_amd64
            sm_arm64
            install.sh
