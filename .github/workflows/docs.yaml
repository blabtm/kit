name: Publish Docs

on:
  workflow_dispatch:
  push:
    branches:
      - trunk

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install Dependencies
        run: pip install -r docs/requirements.txt
      
      - name: Build Static
        run: mkdocs build

      - name: Upload
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages-deploy:
    needs: pages-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4