networks:
  v2k:
    external: true

services:
  em-es-manager:
    image: ghcr.io/blabtm/v2k.em-es:latest
    command: standalone-job --job-classname org.blab.v2k.em_es.Application
    volumes:
      - /etc/v2k:/etc/v2k
    environment:
      CONFIG_DIR: /etc/v2k
      RP_URI: $RP_KAFKA_HOST:$RP_KAFKA_PORT
      SR_URI: http://$SR_HOST:$SR_PORT
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: em-es-manager
        parallelism.default: 1
    networks:
      - v2k

  em-es-worker:
    image: ghcr.io/blabtm/v2k.em-es:latest
    command: taskmanager
    scale: 1
    volumes:
      - /etc/v2k:/etc/v2k
    environment:
      CONFIG_DIR: /etc/v2k
      RP_URI: $RP_KAFKA_HOST:$RP_KAFKA_PORT
      SR_URI: http://$SR_HOST:$SR_PORT
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: em-es-manager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
    networks:
      - v2k
    depends_on:
      - em-es-manager
